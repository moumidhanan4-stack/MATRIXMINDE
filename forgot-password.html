<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro-Solar Designer - Récupération</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght=400;600;700&display=swap');
        body { background-color: #0f1115; color: #f1f5f9; font-family: 'Inter', sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .card { background-color: #16191d; border: 1px solid rgba(255,255,255,0.05); padding: 40px; border-radius: 24px; width: 100%; max-width: 400px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .input-group input { background: #1c2127; border: 1px solid rgba(255,255,255,0.1); color: white; padding: 14px; border-radius: 12px; width: 100%; outline: none; transition: 0.3s; font-size: 14px; }
        .input-group input:focus { border-color: #3b82f6; }
        .btn { background: #3b82f6; color: white; width: 100%; padding: 14px; border-radius: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; margin-top: 20px; }
        .btn:hover { background: #2563eb; transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="card">
        <div class="flex flex-col items-center gap-4 mb-8">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-green-500 to-blue-600 flex items-center justify-center shadow-2xl">
                <i class="fas fa-envelope-open-text text-white text-3xl"></i>
            </div>
            <h2 class="text-sm font-black tracking-[0.2em] uppercase text-center">
                Récupération <span class="text-blue-500">Sécurisée</span>
            </h2>
            <p id="stepDesc" class="text-xs text-center text-gray-400">Entrez votre e-mail pour recevoir le code de vérification.</p>
        </div>

        <form id="recoveryForm" class="space-y-5">
            <div class="input-group" id="emailSection">
                <label class="text-[10px] font-black uppercase opacity-40 mb-2 block tracking-widest">Votre Email</label>
                <input type="email" id="resetEmail" placeholder="nom@bureau.com" required>
                <button type="button" id="btnSendCode" onclick="sendVerificationCode()" class="btn">Envoyer le code</button>
            </div>

            <div id="nextStepsSection" class="hidden space-y-5">
                <div class="input-group">
                    <label class="text-[10px] font-black uppercase opacity-40 mb-2 block tracking-widest">Code reçu par Email</label>
                    <input type="text" id="verificationCode" placeholder="X X X X X X">
                </div>

                <div class="input-group">
                    <label class="text-[10px] font-black uppercase opacity-40 mb-2 block tracking-widest">Nouveau mot de passe</label>
                    <input type="password" id="newPassword" placeholder="••••••••">
                </div>

                <button type="submit" class="btn !bg-green-600 hover:!bg-green-700">Mettre à jour le mot de passe</button>
            </div>
            
            <button type="button" onclick="window.location.href='login.html'" class="w-full mt-3 bg-transparent border border-white/10 text-gray-400 hover:text-white py-3 rounded-xl font-semibold text-xs uppercase tracking-widest transition-all">
                Retour à la connexion
            </button>
        </form>
    </div>

    <script>
        let currentEmail = "";

        // دالة إرسال الكود للإيميل حقيقي
        async function sendVerificationCode() {
            const emailInput = document.getElementById('resetEmail').value.trim();
            if(!emailInput) { alert("Veuillez saisir votre email"); return; }
            
            document.getElementById('btnSendCode').innerText = "Envoi en cours...";
            
            try {
                const response = await fetch('http://127.0.0.1:5000/api/forgot-password', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email: emailInput })
                });
                const result = await response.json();

                if (response.ok) {
                    currentEmail = emailInput;
                    alert("Un code secret a été envoyé à votre adresse email !");
                    
                    // إخفاء خانة الإيميل وإظهار خانات الكود والكود الجديد
                    document.getElementById('resetEmail').disabled = true;
                    document.getElementById('btnSendCode').classList.add('hidden');
                    document.getElementById('nextStepsSection').classList.remove('hidden');
                    document.getElementById('stepDesc').innerText = "Saisissez le code reçu et votre nouveau mot de passe.";
                } else {
                    alert(result.message || "Erreur lors de l'envoi");
                    document.getElementById('btnSendCode').innerText = "Envoyer le code";
                }
            } catch (error) {
                alert("Erreur de connexion avec Flask");
                document.getElementById('btnSendCode').innerText = "Envoyer le code";
            }
        }

        // دالة إرسال الكود الجديد والتحقق
        document.getElementById('recoveryForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const code = document.getElementById('verificationCode').value.trim();
            const password = document.getElementById('newPassword').value;

            if(!code || !password) { alert("Veuillez remplir tous les champs"); return; }

            try {
                const response = await fetch('http://127.0.0.1:5000/api/reset-password-with-code', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email: currentEmail, code: code, password: password })
                });
                const result = await response.json();

                if (response.ok) {
                    alert("Félicitations ! Votre mot de passe a été mis à jour dans users.db.");
                    window.location.href = 'login.html';
                } else {
                    alert(result.message || "Code incorrect");
                }
            } catch (error) {
                alert("Erreur de connexion serveur");
            }
        });
    </script>
</body>
</html>
