<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Flow - Connexion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        
        body { 
            background-color: #0f1115; 
            color: #f1f5f9; 
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }

        .login-card {
            background-color: #16191d;
            border: 1px solid rgba(255,255,255,0.05);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .input-group input {
            background: #1c2127;
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 14px;
            border-radius: 12px;
            width: 100%;
            outline: none;
            transition: 0.3s;
            font-size: 14px;
        }

        .input-group input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }

        .btn-login {
            background: #3b82f6;
            color: white;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
            margin-top: 20px;
        }

        .btn-login:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3);
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            background: rgba(59,130,246,0.1);
            color: #3b82f6;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: 0 auto 20px auto;
        }
    </style>
</head>
<body>

    <div class="login-card">
<!-- Logo Box -->
 
<div class="flex flex-col items-center gap-4 mb-8">
<div class="flex justify-center mb-6">
    <div class="relative w-20 h-20 bg-gradient-to-br from-blue-900 to-blue-800 rounded-2xl shadow-xl flex items-center justify-center">
        <!-- Had l-SVG rddinah m-sntri 100% -->
        <svg class="w-12 h-12 text-white" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 17V7H9L12 11L15 7H18V17" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="12" cy="11" r="2" fill="#38bdf8" class="animate-pulse" />
            <path d="M4 19h16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
        </svg>
    </div>
</div>
    <h2 class="text-sm font-black tracking-[0.2em] uppercase">
               <span class="font-bold text-blue-900">Matrix</span><span class="font-bold text-sky-500">Mind</span> 
    </h2>
</div>

        <form id="loginForm" class="space-y-5">
            <div class="input-group">
                <label class="text-[10px] font-black uppercase opacity-40 mb-2 block tracking-widest">Identifiant</label>
                <input type="text" id="username" placeholder="Entrez votre email" required>
            </div>

            <div class="input-group">
                <label class="text-[10px] font-black uppercase opacity-40 mb-2 block tracking-widest">Mot de passe</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <div class="flex justify-between items-center text-xs mt-2">
    <div></div> <a href="forgot-password.html" class="text-blue-500 hover:underline tracking-wide uppercase font-semibold text-[10px]">
        Mot de passe oublié ?
    </a>
</div>
            <button type="submit" class="btn-login" >
                Se Connecter
            </button>
            <button type="button" onclick="window.location.href='register.html'" class="w-full mt-3 bg-transparent border border-white/10 text-gray-400 hover:text-white hover:border-blue-500 py-3 rounded-xl font-semibold text-xs uppercase tracking-widest transition-all">
                Créer un compte
            </button>
        </form>

<div class="mt-4 pt-3 border-t border-gray-100/60 text-center">
    <p class="text-[11px] tracking-tight">
        <span class="font-bold text-blue-900">Matrix</span><span class="font-bold text-sky-500">Mind</span> 
        <span class="mx-1 text-gray-300">|</span> 
        <span class="text-gray-400 font-medium">Votre Solution de Calcul Matriciel</span>
    </p>
</div>
    </div>

    <script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    // جلب الإيميل اللي كتبو المستخدم ف الخانة
    const emailInput = document.getElementById('username').value;
    const passwordInput = document.getElementById('password').value;

    const data = {
        email: emailInput,
        password: passwordInput
    };

    try {
        const response = await fetch('http://127.0.0.1:5000/api/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (response.ok && result.status === "success") {
            // 1. الحفظ ديال الـ Username باش يبان ف الترحيب (Bonjour)
            localStorage.setItem('userName', result.username);
            
            // 👑 2. السر اللي كان ناقص: كنحفظو الإيميل بساروت 'userEmail'
            // يلا كان الـ API كيرد الإيميل ف الـ JSON غنديرو: result.email 
            // يلا مكانش كيردو، كوناخذو ديريكت الإيميل اللي كتبو المستخدم ف الفورم (emailInput)
            const loggedInEmail = result.email || emailInput;
            localStorage.setItem('userEmail', loggedInEmail.trim());
            
            console.log("✅ Connexion réussie. Email stocké : " + loggedInEmail);

            // 3. الدخول للمشاريع (Workspace)
            window.location.href = 'exemple.html'; 
        } else {
            alert(result.message || "Identifiants incorrects");
        }
    } catch (error) {
        console.error("Erreur:", error);
        alert("Erreur de connexion au serveur Flask");
    }
});

// دالة مساعدة
function saveUserName(name) {
    localStorage.setItem('userName', name); 
}
// تشييك واش هاد المستخدم ديجا بدل كودو لوكال
const localUpdatedPass = localStorage.getItem('local_new_password_' + emailInput);

if ((response.ok && result.status === "success") || (localUpdatedPass && localUpdatedPass === passwordInput)) {
    // الدخول ناجح
    localStorage.setItem('userName', result.username || emailInput.split('@')[0]);
    localStorage.setItem('userEmail', emailInput.trim());
    window.location.href = 'exemple.html'; 
}

</script>
</body>
</html>
