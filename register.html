<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Flow - Inscription</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { background-color: #0f1115; color: #f1f5f9; font-family: 'Inter', sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; overflow: hidden; }
        .login-card { background-color: #16191d; border: 1px solid rgba(255,255,255,0.05); padding: 40px; border-radius: 24px; width: 100%; max-width: 400px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .input-group input { background: #1c2127; border: 1px solid rgba(255,255,255,0.1); color: white; padding: 14px; border-radius: 12px; width: 100%; outline: none; transition: 0.3s; font-size: 14px; }
        .input-group input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
        .btn-login { background: #3b82f6; color: white; width: 100%; padding: 14px; border-radius: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; margin-top: 20px; }
        .btn-login:hover { background: #2563eb; transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3); }
    </style>
</head>
<body>

    <div class="login-card">
<div class="flex flex-col items-center gap-4 mb-8">
<div class="flex justify-center mb-6">
    <div class="relative w-20 h-20 bg-gradient-to-br from-blue-900 to-blue-800 rounded-2xl shadow-xl flex items-center justify-center">
        <!-- Had l-SVG rddinah m-sntri 100% -->
        <svg class="w-12 h-12 text-white" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 17V7H9L12 11L15 7H18V17" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="12" cy="11" r="2" fill="#38bdf8" class="animate-pulse" />
            <path d="M4 19h16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
        </svg>
    </div>
</div>
    <h2 class="text-sm font-black tracking-[0.2em] uppercase">
            <h2 class="text-sm font-black tracking-[0.2em] uppercase">INSCRIPTION</h2>
    </h2>
</div>

        <form id="registerForm" class="space-y-5">
            <div class="input-group">
                <label class="text-[10px] font-black uppercase opacity-40 mb-2 block tracking-widest">Identifiant</label>
                <input type="text" id="reg_username" placeholder="Choisissez votre nom" required>
            </div>
            
            <div class="input-group">
                <label class="text-[10px] font-black uppercase opacity-40 mb-2 block tracking-widest">Email</label>
                <input type="email" id="reg_email" placeholder="exemple@gmail.com" required>
            </div>

            <div class="input-group">
                <label class="text-[10px] font-black uppercase opacity-40 mb-2 block tracking-widest">Mot de passe</label>
                <input type="password" id="reg_password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn-login">S'inscrire</button>
            <button type="button" onclick="window.location.href='login.html'" class="w-full mt-2 text-center text-xs text-gray-400 hover:text-white block">Retour à la connexion</button>
        </form>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('reg_username').value.trim();
            const email = document.getElementById('reg_email').value.trim();
            const password = document.getElementById('reg_password').value.trim();

            try {
                const response = await fetch('http://127.0.0.1:5000/api/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username, email, password })
                });

                const result = await response.json();

                if (response.ok && result.status === "success") {
                    alert("Compte créé avec succès !");
                    window.location.href = 'login.html'; 
                } else {
                    alert(result.message || "Erreur lors de l'inscription");
                }
            } catch (error) {
                console.error("Erreur:", error);
                alert("Erreur de connexion au serveur Flask");
            }
        });
    </script>
</body>
</html>
